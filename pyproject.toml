[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsc-bench"
version = "0.1.0"
description = "AgentSC-Bench: An Open Benchmark for Reliable Agentic AI in Multi-Echelon Supply Chains"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Mohammed Amine Goumri", email = "mohammedaminegoumri@proton.me"}
]
keywords = ["supply-chain", "multi-agent", "llm", "benchmark", "beer-game", "reliability", "bullwhip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "streamlit>=1.29.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.6.0"]
anthropic = ["anthropic>=0.8.0"]
gemini = ["google-generativeai>=0.3.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "mypy>=1.7.0", "ruff>=0.1.0"]

[project.scripts]
agentsc-run = "experiments.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "environment*", "llm*", "memory*", "tools*", "metrics*", "experiments*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
